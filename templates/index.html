<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBrainFM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080812;
      --surface:    #0f0f20;
      --surface-2:  #161628;
      --border:     rgba(255,255,255,0.08);
      --border-2:   rgba(255,255,255,0.16);
      --text:       #e2e4f6;
      --text-2:     #8890c0;
      --text-3:     #353560;
      --mode-color: #4a8fff;
      --mode-glow:  rgba(74,143,255,0.18);
      --font:       'Nunito', sans-serif;
      --font-mono:  'Space Mono', monospace;
      --r:          14px;
      --r-sm:       10px;
      --t:          0.4s cubic-bezier(0.4,0,0.2,1);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Dreamy nebula background ─────────────────────────────── */
    #nebula {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    #nebula::before, #nebula::after, #nebula span {
      content: ''; position: absolute; border-radius: 50%;
      background: radial-gradient(circle, var(--mode-color) 0%, transparent 65%);
      transition: background 1.4s ease;
    }
    #nebula::before {
      width: 75vw; height: 75vw; opacity: 0.045;
      top: -30%; left: -20%;
      animation: neb-a 32s ease-in-out infinite alternate;
    }
    #nebula::after {
      width: 60vw; height: 60vw; opacity: 0.035;
      bottom: -28%; right: -15%;
      animation: neb-b 40s ease-in-out infinite alternate;
    }
    #nebula span {
      display: block; width: 40vw; height: 40vw; opacity: 0.025;
      top: 40%; left: 35%;
      animation: neb-c 26s ease-in-out infinite alternate;
    }
    @keyframes neb-a { from{transform:translate(0,0) scale(1)} to{transform:translate(8vw,14vh) scale(1.3)} }
    @keyframes neb-b { from{transform:translate(0,0) scale(1.1)} to{transform:translate(-12vw,-8vh) scale(0.85)} }
    @keyframes neb-c { from{transform:translate(0,0) scale(1)} to{transform:translate(-6vw,10vh) scale(1.2)} }

    /* ── Layout ───────────────────────────────────────────────── */
    #app {
      position: relative; z-index: 1;
      max-width: 880px; margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 26px 0 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .logo {
      font-weight: 900; font-size: 1.5rem; letter-spacing: -0.03em;
      color: var(--text);
    }
    .logo em { font-style: normal; color: var(--mode-color); transition: color var(--t); }

    #status-pill {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-2);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px; padding: 6px 14px;
      transition: all var(--t);
    }
    #status-pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-3); transition: background 0.3s, box-shadow 0.3s;
    }
    #status-pill.playing .dot {
      background: var(--mode-color);
      box-shadow: 0 0 10px var(--mode-color);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    #status-pill.playing { color: var(--text); border-color: var(--border-2); }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .header-btns { display: flex; gap: 8px; }
    .icon-btn {
      background: none; border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 7px 16px;
      color: var(--text-2); font-family: var(--font);
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--border-2); color: var(--text); }
    .icon-btn.active { border-color: var(--mode-color); color: var(--mode-color); }

    /* ── Visualizer ───────────────────────────────────────────── */
    .viz-wrap {
      border-radius: var(--r) var(--r) 0 0;
      overflow: hidden; background: var(--surface);
      border: 1px solid var(--border); border-bottom: none;
      position: relative;
    }
    #waveform { width: 100%; height: 120px; display: block; }

    /* ── Mode Info ────────────────────────────────────────────── */
    .mode-info {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-top: 1px solid var(--border-2);
      border-radius: 0 0 var(--r) var(--r);
      margin-bottom: 22px; min-height: 62px;
    }
    #mode-name {
      font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em;
      color: var(--text); transition: color var(--t);
    }
    #mode-tagline { font-size: 0.8rem; color: var(--text-2); font-weight: 400; margin-top: 2px; }
    #mode-band {
      font-family: var(--font-mono); font-size: 0.7rem;
      color: var(--mode-color); font-weight: 700; text-align: right;
      transition: color var(--t);
    }
    #mode-hz { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-3); margin-top: 3px; text-align: right; }

    /* ── Modes Grid ───────────────────────────────────────────── */
    .section-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 12px;
    }
    #modes-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 28px;
    }

    .mode-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      cursor: pointer; overflow: hidden;
      transition: all 0.28s cubic-bezier(0.4,0,0.2,1);
      user-select: none; position: relative;
    }
    .mode-card::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(160deg, var(--card-color) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.3s;
    }
    .mode-card:hover { border-color: var(--border-2); transform: translateY(-2px); }
    .mode-card:hover::after { opacity: 0.05; }
    .mode-card.active {
      border-color: var(--card-color);
      box-shadow: 0 0 0 1px var(--card-color), 0 0 28px -6px var(--card-color);
      transform: translateY(-3px);
    }
    .mode-card.active::after { opacity: 0.08; }

    .card-artwork {
      width: 100%; padding: 12px 12px 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .card-artwork svg { width: 100%; height: 60px; }

    .card-body { padding: 4px 12px 12px; position: relative; z-index: 1; }
    .card-name {
      font-weight: 800; font-size: 0.85rem; color: var(--text);
      letter-spacing: -0.01em; margin-bottom: 3px;
    }
    .card-tagline { font-size: 0.7rem; color: var(--text-2); font-weight: 400; line-height: 1.3; }
    .card-hz { font-family: var(--font-mono); font-size: 0.56rem; color: var(--text-3); margin-top: 7px; }

    /* ── Controls ─────────────────────────────────────────────── */
    .controls {
      display: flex; align-items: center; gap: 20px;
      justify-content: center; margin-bottom: 28px;
    }
    #play-btn {
      width: 76px; height: 76px; border-radius: 50%;
      background: var(--surface-2); border: 2px solid var(--border-2);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.25s; flex-shrink: 0;
    }
    #play-btn:hover { border-color: var(--mode-color); transform: scale(1.07); }
    #play-btn.playing {
      border-color: var(--mode-color);
      box-shadow: 0 0 0 7px var(--mode-glow), 0 0 36px -6px var(--mode-color);
      animation: play-ring 2.5s ease-in-out infinite;
    }
    @keyframes play-ring {
      0%,100%{ box-shadow:0 0 0 7px var(--mode-glow),0 0 36px -6px var(--mode-color); }
      50%    { box-shadow:0 0 0 14px rgba(74,143,255,0.06),0 0 48px -4px var(--mode-color); }
    }

    .slider-group { display: flex; flex-direction: column; gap: 8px; flex: 1; max-width: 170px; }
    .slider-label {
      display: flex; justify-content: space-between;
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
    }
    .slider-label span { color: var(--text-2); font-weight: 600; }

    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px;
      background: var(--surface-2); border-radius: 2px;
      outline: none; cursor: pointer; border: 1px solid var(--border);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--mode-color);
      box-shadow: 0 0 10px var(--mode-color); cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); box-shadow: 0 0 18px var(--mode-color); }
    input[type=range]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--mode-color); border: none; box-shadow: 0 0 10px var(--mode-color);
    }

    /* ── Pomodoro ─────────────────────────────────────────────── */
    #pomo-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 24px;
      animation: slide-up 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    #pomo-section.hidden { display: none; }
    @keyframes slide-up { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }

    .pomo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .pomo-title { font-weight: 800; font-size: 0.85rem; color: var(--text-2); letter-spacing: 0.04em; text-transform: uppercase; }
    .pomo-sessions { display: flex; gap: 6px; }
    .pomo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-2); transition: background 0.3s; }
    .pomo-dot.done { background: var(--mode-color); }

    .pomo-body { display: flex; align-items: center; gap: 32px; }
    .pomo-ring-wrap { position: relative; flex-shrink: 0; width: 120px; height: 120px; }
    .pomo-ring-wrap svg { width: 120px; height: 120px; }
    .pomo-track { fill: none; stroke: var(--surface-2); stroke-width: 5; }
    #pomo-progress {
      fill: none; stroke: var(--mode-color); stroke-width: 5;
      stroke-linecap: round; stroke-dasharray: 283; stroke-dashoffset: 0;
      transform: rotate(-90deg); transform-origin: center;
      transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
    }
    .pomo-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #pomo-time { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; color: var(--text); }
    #pomo-phase-label {
      font-size: 0.6rem; font-weight: 700; color: var(--mode-color);
      letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
    }

    .pomo-controls { flex: 1; }
    .pomo-btns { display: flex; gap: 8px; margin-bottom: 18px; }
    .pomo-btn {
      flex: 1; padding: 10px 0; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      color: var(--text-2); font-family: var(--font); font-weight: 700;
      font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
    }
    .pomo-btn:hover { border-color: var(--border-2); color: var(--text); }
    .pomo-btn.primary { border-color: var(--mode-color); color: var(--mode-color); }
    .pomo-btn.primary:hover { background: var(--mode-color); color: var(--bg); }

    .pomo-settings { display: flex; flex-direction: column; gap: 9px; }
    .pomo-setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pomo-setting-label { font-size: 0.7rem; font-weight: 600; color: var(--text-3); white-space: nowrap; }
    .pomo-setting input[type=range] { max-width: 110px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 2px; }

    @media (max-width: 640px) {
      #modes-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .controls { gap: 14px; }
      .pomo-body { flex-direction: column; align-items: center; }
    }
    @media (min-width: 641px) and (max-width: 800px) {
      #modes-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 801px) {
      #modes-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div id="nebula"><span></span></div>

  <div id="app">
    <header>
      <div class="logo">MyBrain<em>FM</em></div>
      <div id="status-pill">
        <div class="dot"></div>
        <span id="status-text">idle</span>
      </div>
      <div class="header-btns">
        <button class="icon-btn" id="pomo-toggle-btn">⏱ timer</button>
      </div>
    </header>

    <div class="viz-wrap"><canvas id="waveform"></canvas></div>

    <div class="mode-info">
      <div>
        <div id="mode-name">—</div>
        <div id="mode-tagline">select a mode to begin</div>
      </div>
      <div>
        <div id="mode-band"></div>
        <div id="mode-hz"></div>
      </div>
    </div>

    <div class="section-label">Modes</div>
    <div id="modes-grid"></div>

    <div class="controls">
      <div class="slider-group">
        <div class="slider-label">Volume <span id="vol-val">80%</span></div>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>

      <button id="play-btn">
        <svg id="play-icon" width="30" height="30" viewBox="0 0 28 28" fill="none">
          <path id="icon-path" d="M8 5.5L22 14L8 22.5V5.5Z" fill="var(--text)"/>
        </svg>
      </button>

      <div class="slider-group">
        <div class="slider-label">Intensity <span id="int-val">50%</span></div>
        <input type="range" id="intensity-slider" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <div id="pomo-section" class="hidden">
      <div class="pomo-header">
        <div class="pomo-title">Pomodoro</div>
        <div class="pomo-sessions" id="pomo-dots"></div>
      </div>
      <div class="pomo-body">
        <div class="pomo-ring-wrap">
          <svg viewBox="0 0 100 100">
            <circle class="pomo-track" cx="50" cy="50" r="45"/>
            <circle id="pomo-progress" cx="50" cy="50" r="45" style="stroke-dasharray:282.7;stroke-dashoffset:0;"/>
          </svg>
          <div class="pomo-center">
            <div id="pomo-time">25:00</div>
            <div id="pomo-phase-label">work</div>
          </div>
        </div>
        <div class="pomo-controls">
          <div class="pomo-btns">
            <button class="pomo-btn primary" id="pomo-start">Start</button>
            <button class="pomo-btn" id="pomo-reset">Reset</button>
          </div>
          <div class="pomo-settings">
            <div class="pomo-setting">
              <span class="pomo-setting-label">Work <span id="pomo-work-val">25</span>m</span>
              <input type="range" id="pomo-work" min="5" max="60" step="5" value="25">
            </div>
            <div class="pomo-setting">
              <span class="pomo-setting-label">Break <span id="pomo-break-val">5</span>m</span>
              <input type="range" id="pomo-break" min="1" max="30" step="1" value="5">
            </div>
            <div class="pomo-setting">
              <span class="pomo-setting-label">Long Break <span id="pomo-long-val">15</span>m</span>
              <input type="range" id="pomo-long" min="5" max="60" step="5" value="15">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>

      relax: `<svg viewBox="0 0 80 56" fill="none" xmlns="http://www.w3.org/2000/svg">

      ambient: `<svg viewBox="0 0 80 56" fill="none" xmlns="http://www.w3.org/2000/svg">

    // ── Helpers ───────────────────────────────────────────────────
    function hexToRgba(hex, a) {
      const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }
    function setModeColor(c) {
      document.documentElement.style.setProperty('--mode-color', c);
      document.documentElement.style.setProperty('--mode-glow', hexToRgba(c, 0.18));
    }
    function formatTime(s) {
      return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    }

    // ── Audio Engine ──────────────────────────────────────────────
    class NeuroAudioEngine {
      constructor() {
        this.ctx=null; this.analyser=null; this.masterGain=null;
        this.sources=[]; this.isPlaying=false; this.mode=null;
        this.intensity=0.5; this.volume=0.8;
        this.nextStart=0; this.chunkOffset=0; this.genId=0; this.schedTimer=null;
        this.LOOKAHEAD=3;
      }
      async _ensureCtx() {
        if (!this.ctx) {
          this.ctx=new (window.AudioContext||window.webkitAudioContext)();
          this.analyser=this.ctx.createAnalyser();
          this.analyser.fftSize=2048; this.analyser.smoothingTimeConstant=0.85;
          this.masterGain=this.ctx.createGain();
          this.masterGain.gain.value=this.volume;
          this.masterGain.connect(this.analyser);
          this.analyser.connect(this.ctx.destination);
        }
        if (this.ctx.state==='suspended') await this.ctx.resume();
      }
      _clearSources(genId) {
        this.genId=genId;
        this.sources.forEach(s=>{try{s.stop(0)}catch(e){}});
        this.sources=[];
        if(this.schedTimer){clearInterval(this.schedTimer);this.schedTimer=null;}
      }
      async _fetchChunk(genId,offset) {
        if(genId!==this.genId) return null;
        const url=`/chunk/${this.mode}?t=${offset}&intensity=${this.intensity}`;
        try {
          const r=await fetch(url);
          if(!r.ok) return null;
          if(genId!==this.genId) return null;
          const ab=await r.arrayBuffer();
          if(genId!==this.genId) return null;
          return await this.ctx.decodeAudioData(ab);
        } catch(e){ console.warn(e); return null; }
      }
      async _schedule(genId,offset) {
        const buf=await this._fetchChunk(genId,offset);
        if(!buf||genId!==this.genId) return;
        const src=this.ctx.createBufferSource();
        src.buffer=buf; src.connect(this.masterGain);
        src.onended=()=>{this.sources=this.sources.filter(s=>s!==src);};
        const at=Math.max(this.nextStart,this.ctx.currentTime+0.05);
        src.start(at);
        this.nextStart=at+buf.duration;
        this.chunkOffset=offset+CHUNK_DURATION;
        this.sources.push(src);
      }
      _startScheduler(genId) {
        this.schedTimer=setInterval(async()=>{
          if(genId!==this.genId||!this.isPlaying) return;
          if(this.nextStart-this.ctx.currentTime<this.LOOKAHEAD)
            await this._schedule(genId,this.chunkOffset);
        },700);
      }
      async play(mode,newIntensity=null) {
        await this._ensureCtx();
        if(newIntensity!==null) this.intensity=newIntensity;
        this.mode=mode; this.isPlaying=true;
        const genId=++this.genId;
        this._clearSources(genId);
        this.nextStart=this.ctx.currentTime+0.12;
        this.chunkOffset=0;
        await this._schedule(genId,0);
        await this._schedule(genId,CHUNK_DURATION);
        if(genId===this.genId) this._startScheduler(genId);
      }
      stop() {
        this.isPlaying=false;
        this._clearSources(this.genId+1);
        if(this.masterGain&&this.ctx){
          this.masterGain.gain.setTargetAtTime(0,this.ctx.currentTime,0.15);
          setTimeout(()=>{if(this.masterGain)this.masterGain.gain.value=this.volume;},600);
        }
      }
      setVolume(v){this.volume=v;if(this.masterGain&&this.ctx)this.masterGain.gain.setTargetAtTime(v,this.ctx.currentTime,0.05);}
      async setIntensity(v){this.intensity=v;if(this.isPlaying&&this.mode)await this.play(this.mode);}
      getWaveformData(){if(!this.analyser)return null;const d=new Uint8Array(this.analyser.frequencyBinCount);this.analyser.getByteTimeDomainData(d);return d;}
    }
    const engine=new NeuroAudioEngine();

    // ── State ─────────────────────────────────────────────────────
    let activeMode=null, isPlaying=false, volume=0.8, intensity=0.5;

    // ── Build Grid ────────────────────────────────────────────────
    function buildModeGrid() {
      const grid=document.getElementById('modes-grid');
      Object.entries(MODES).forEach(([key,mode])=>{
        const card=document.createElement('div');
        card.className='mode-card'; card.dataset.mode=key;
        card.style.setProperty('--card-color',mode.color);
        card.innerHTML=`
          <div class="card-artwork">${ARTWORKS[key]||''}</div>
          <div class="card-body">
            <div class="card-name">${mode.name}</div>
            <div class="card-tagline">${mode.tagline}</div>
            <div class="card-hz">${mode.entrainment_hz} Hz · ${mode.band_name}</div>
          </div>`;
        card.addEventListener('click',()=>selectMode(key));
        grid.appendChild(card);
      });
    }

    // ── Mode Selection ────────────────────────────────────────────
    function selectMode(key) {
      activeMode=key;
      const mode=MODES[key];
      document.querySelectorAll('.mode-card').forEach(c=>c.classList.toggle('active',c.dataset.mode===key));
      document.getElementById('mode-name').textContent=mode.name;
      document.getElementById('mode-tagline').textContent=mode.tagline;
      document.getElementById('mode-band').textContent=`${mode.band} · ${mode.band_name}`;
      document.getElementById('mode-hz').textContent=`${mode.entrainment_hz} Hz AM modulation`;
      setModeColor(mode.color);
      if(isPlaying) startAudio();
    }

    // ── Playback ──────────────────────────────────────────────────
    async function startAudio(){if(!activeMode)selectMode('focus');await engine.play(activeMode,intensity);}
    function stopAudio(){engine.stop();}
    function togglePlay(){
      if(!activeMode)selectMode('focus');
      isPlaying=!isPlaying;
      updatePlayBtn(); updateStatusPill();
      if(isPlaying)startAudio(); else{stopAudio();if(pomo.running)pomoStop();}
    }
    function updatePlayBtn(){
      const btn=document.getElementById('play-btn');
      const path=document.getElementById('icon-path');
      btn.classList.toggle('playing',isPlaying);
      if(isPlaying){path.setAttribute('d','M7 5H11V23H7V5ZM17 5H21V23H17V5Z');path.setAttribute('fill','var(--mode-color)');}
      else{path.setAttribute('d','M8 5.5L22 14L8 22.5V5.5Z');path.setAttribute('fill','var(--text)');}
    }
    function updateStatusPill(){
      const pill=document.getElementById('status-pill'),txt=document.getElementById('status-text');
      pill.classList.toggle('playing',isPlaying);
      txt.textContent=isPlaying&&activeMode?MODES[activeMode].name.toLowerCase():'idle';
    }

    document.getElementById('volume-slider').addEventListener('input',e=>{
      volume=parseFloat(e.target.value); engine.setVolume(volume);
      document.getElementById('vol-val').textContent=Math.round(volume*100)+'%';
    });
    let intDebounce;
    document.getElementById('intensity-slider').addEventListener('input',e=>{
      intensity=parseFloat(e.target.value);
      document.getElementById('int-val').textContent=Math.round(intensity*100)+'%';
      clearTimeout(intDebounce); intDebounce=setTimeout(()=>engine.setIntensity(intensity),600);
    });
    document.getElementById('play-btn').addEventListener('click',togglePlay);

    // ── Canvas Waveform ───────────────────────────────────────────
    const canvas=document.getElementById('waveform');
    const ctx2d=canvas.getContext('2d');
    function resizeCanvas(){
      const rect=canvas.parentElement.getBoundingClientRect();
      canvas.width=rect.width*devicePixelRatio; canvas.height=120*devicePixelRatio;
      canvas.style.width=rect.width+'px'; canvas.style.height='120px';
    }
    window.addEventListener('resize',resizeCanvas); resizeCanvas();

    function drawWave(ts) {
      const w=canvas.width, h=canvas.height;
      const color=getComputedStyle(document.documentElement).getPropertyValue('--mode-color').trim()||'#4a8fff';
      ctx2d.clearRect(0,0,w,h);
      const data=engine.getWaveformData();
      [[8*devicePixelRatio,0.04],[4*devicePixelRatio,0.12],[1.8*devicePixelRatio,0.4],[0.9*devicePixelRatio,0.88]].forEach(([lw,a])=>{
        ctx2d.beginPath(); ctx2d.lineWidth=lw; ctx2d.strokeStyle=hexToRgba(color,a);
        ctx2d.lineJoin='round'; ctx2d.lineCap='round';
        if(data&&isPlaying){
          const step=w/data.length;
          for(let i=0;i<data.length;i++){const v=data[i]/128-1,x=i*step,y=h/2+v*h*0.3;i===0?ctx2d.moveTo(x,y):ctx2d.lineTo(x,y);}
        } else {
          const hz=activeMode?Math.min(MODES[activeMode].entrainment_hz,6)*0.35:0.5;
          for(let x=0;x<=w;x+=2){const y=h/2+Math.sin((x/w)*Math.PI*8+ts*0.001*Math.PI*2*hz)*12*devicePixelRatio;x===0?ctx2d.moveTo(x,y):ctx2d.lineTo(x,y);}
        }
        ctx2d.stroke();
      });
      requestAnimationFrame(drawWave);
    }
    requestAnimationFrame(drawWave);

    // ── Pomodoro ──────────────────────────────────────────────────
    const pomo={active:false,running:false,phase:'work',elapsed:0,sessions:0,timer:null,workDur:25*60,breakDur:5*60,longDur:15*60};
    const CIRC=282.7;
    function pomoDur(){return pomo.phase==='work'?pomo.workDur:pomo.phase==='break'?pomo.breakDur:pomo.longDur;}
    function pomoUpdateUI(){
      const dur=pomoDur(),rem=dur-pomo.elapsed,prog=pomo.elapsed/dur;
      document.getElementById('pomo-time').textContent=formatTime(rem);
      document.getElementById('pomo-phase-label').textContent=pomo.phase==='work'?'work':'rest';
      document.getElementById('pomo-progress').style.strokeDashoffset=CIRC*(1-prog);
      const dots=document.getElementById('pomo-dots'); dots.innerHTML='';
      for(let i=0;i<4;i++){const d=document.createElement('div');d.className='pomo-dot'+(i<pomo.sessions%4?' done':'');dots.appendChild(d);}
    }
    function pomoAdvance(){
      if(pomo.phase==='work'){
        pomo.sessions++; pomo.elapsed=0;
        pomo.phase=pomo.sessions%4===0?'longbreak':'break';
        if(isPlaying)engine.play(pomo.phase==='longbreak'?'meditate':'relax',intensity);
        pomoNotify('Rest time!');
      } else {
        pomo.elapsed=0; pomo.phase='work';
        if(isPlaying&&activeMode)engine.play(activeMode,intensity);
        pomoNotify('Back to work!');
      }
      pomoUpdateUI();
    }
    function pomoStart(){
      if(pomo.running){clearInterval(pomo.timer);pomo.running=false;document.getElementById('pomo-start').textContent='Resume';}
      else{if(!isPlaying)togglePlay();pomo.running=true;pomo.timer=setInterval(()=>{pomo.elapsed++;if(pomo.elapsed>=pomoDur())pomoAdvance();else pomoUpdateUI();},1000);document.getElementById('pomo-start').textContent='Pause';}
    }
    function pomoStop(){clearInterval(pomo.timer);pomo.running=false;}
    function pomoReset(){pomoStop();pomo.elapsed=0;pomo.phase='work';pomo.sessions=0;document.getElementById('pomo-start').textContent='Start';pomoUpdateUI();if(isPlaying&&activeMode)engine.play(activeMode,intensity);}
    function pomoNotify(msg){if('Notification'in window&&Notification.permission==='granted')new Notification('neuro',{body:msg});}

    document.getElementById('pomo-start').addEventListener('click',pomoStart);
    document.getElementById('pomo-reset').addEventListener('click',pomoReset);
    ['work','break','long'].forEach(t=>{
      const el=document.getElementById(`pomo-${t}`);
      el.addEventListener('input',()=>{
        const v=parseInt(el.value);
        document.getElementById(`pomo-${t}-val`).textContent=v;
        if(t==='work')pomo.workDur=v*60;
        if(t==='break')pomo.breakDur=v*60;
        if(t==='long')pomo.longDur=v*60;
        if(!pomo.running){pomo.elapsed=0;pomoUpdateUI();}
      });
    });
    document.getElementById('pomo-toggle-btn').addEventListener('click',()=>{
      const sec=document.getElementById('pomo-section');
      const hidden=sec.classList.toggle('hidden');
      document.getElementById('pomo-toggle-btn').classList.toggle('active',!hidden);
      if(!hidden){pomoUpdateUI();if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}
      if(hidden&&pomo.running)pomoStop();
    });

    buildModeGrid();
    pomoUpdateUI();
  </script>
