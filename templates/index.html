<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBrainFM</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#4a8fff;
      --accent-2:#7c4dff;
      --glow:rgba(74,143,255,0.25);
      --surface:rgba(6,6,18,0.75);
      --surface-2:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.09);
      --border-h:rgba(255,255,255,0.18);
      --text:#eceef8;
      --text-2:rgba(255,255,255,0.45);
      --font:'Nunito',sans-serif;
      --mono:'Space Mono',monospace;
    }
    html,body{width:100%;height:100%;overflow:hidden;background:#04040e}
    body{font-family:var(--font);color:var(--text)}

    /* ─── YouTube hidden ─────────────────────────── */
    #yt{position:fixed;width:1px;height:1px;top:-9999px;left:-9999px;pointer-events:none;z-index:-1}

    /* ─── Background ─────────────────────────────── */
    #bg{position:fixed;inset:0;z-index:0}
    .slide{
      position:absolute;inset:0;background-size:cover;background-position:center;
      opacity:0;transition:opacity 3s cubic-bezier(0.4,0,0.2,1);
      transform:translateZ(0);backface-visibility:hidden;
    }
    .slide.on{opacity:1;animation:kb 160s ease-in-out infinite alternate}
    @keyframes kb{from{transform:translate(0%,0%)}to{transform:translate(-0.6%,-0.3%)}}

    /* Cinematic gradient overlays */
    #vignette{
      position:fixed;inset:0;z-index:1;pointer-events:none;
      background:
        radial-gradient(ellipse 80% 60% at 50% 120%, rgba(4,4,14,0.85) 0%, transparent 70%),
        radial-gradient(ellipse 100% 40% at 50% 0%, rgba(4,4,14,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 0% 50%, rgba(74,143,255,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 50%, rgba(124,77,255,0.04) 0%, transparent 50%);
    }

    /* ─── WebGL Spotlight Canvas ─────────────────── */
    #spotlight{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:0.6}

    /* ─── UI Layer ───────────────────────────────── */
    #ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;padding:28px 32px 32px;pointer-events:none}

    /* ─── Header ─────────────────────────────────── */
    #top{display:flex;align-items:center;justify-content:space-between;pointer-events:all;animation:fade-down 1s 0.2s both}
    @keyframes fade-down{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

    .logo{font-weight:900;font-size:1.4rem;letter-spacing:-0.025em;color:var(--text)}
    .logo b{color:var(--accent);font-weight:900}

    #pill{
      display:flex;align-items:center;gap:8px;
      font-family:var(--mono);font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;
      color:var(--text-2);background:var(--surface);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border:1px solid var(--border);border-radius:100px;padding:6px 14px;
      transition:all 0.4s;
    }
    #pill .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);flex-shrink:0;transition:all 0.3s}
    #pill.on .dot{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 2s infinite}
    #pill.on{color:var(--text);border-color:rgba(74,143,255,0.3)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.35}}

    #timer-btn{
      background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border:1px solid var(--border);border-radius:10px;
      padding:8px 18px;color:var(--text-2);font-family:var(--font);font-size:0.8rem;font-weight:700;
      cursor:pointer;transition:all 0.2s;letter-spacing:0.02em;
    }
    #timer-btn:hover{border-color:var(--border-h);color:var(--text)}
    #timer-btn.on{border-color:var(--accent);color:var(--accent)}

    /* ─── Center Label ───────────────────────────── */
    #center{display:flex;align-items:center;justify-content:center;flex:1;pointer-events:none}
    #ambience{
      font-weight:200;font-size:clamp(2rem,5vw,4rem);
      letter-spacing:0.5em;text-transform:uppercase;
      color:rgba(255,255,255,0.10);text-indent:0.5em;
      animation:fade-in 2s 0.8s both;user-select:none;
    }
    @keyframes fade-in{from{opacity:0}to{opacity:1}}

    /* ─── Slide dots ─────────────────────────────── */
    #dots{display:flex;gap:7px;justify-content:center;pointer-events:all;margin-bottom:20px;animation:fade-up 1s 0.6s both}
    @keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .dot-btn{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.25);border:none;cursor:pointer;padding:0;transition:all 0.3s}
    .dot-btn.on{background:var(--accent);box-shadow:0 0 8px var(--accent);width:18px;border-radius:3px}
    .dot-btn:hover{background:rgba(255,255,255,0.55)}

    /* ─── Player Bar ─────────────────────────────── */
    #player{
      display:flex;align-items:center;gap:20px;
      background:var(--surface);
      backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
      border:1px solid var(--border);
      border-top:1px solid rgba(255,255,255,0.13);
      border-radius:20px;padding:16px 24px;
      pointer-events:all;
      animation:fade-up 1s 0.4s both;
      box-shadow:0 -4px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    /* Control buttons */
    .ctrl{
      width:38px;height:38px;border-radius:50%;
      background:var(--surface-2);border:1px solid var(--border);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;color:var(--text-2);transition:all 0.2s;
    }
    .ctrl:hover{background:rgba(255,255,255,0.1);color:var(--text);border-color:var(--border-h)}
    .ctrl svg{width:15px;height:15px}

    /* Play button */
    #play{
      width:60px;height:60px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all 0.25s;
      box-shadow:0 0 24px var(--glow), 0 4px 16px rgba(0,0,0,0.4);
    }
    #play:hover{transform:scale(1.08);box-shadow:0 0 36px var(--glow),0 0 60px rgba(74,143,255,0.15)}
    #play.on{animation:pulse 2.5s ease-in-out infinite;box-shadow:0 0 30px var(--glow),0 0 60px rgba(74,143,255,0.12)}
    @keyframes pulse{
      0%,100%{box-shadow:0 0 30px var(--glow),0 0 60px rgba(74,143,255,0.12)}
      50%{box-shadow:0 0 45px var(--glow),0 0 80px rgba(74,143,255,0.2)}
    }

    /* Volume */
    .vol-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
    .vol-label{display:flex;justify-content:space-between;font-size:0.62rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-2)}
    .vol-label span{color:var(--text)}

    input[type=range]{
      -webkit-appearance:none;appearance:none;width:100%;height:3px;
      background:rgba(255,255,255,0.1);border-radius:2px;outline:none;cursor:pointer;
    }
    input[type=range]::-webkit-slider-thumb{
      -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
      background:var(--accent);box-shadow:0 0 10px var(--glow);cursor:pointer;
      transition:transform 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.4)}
    input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;box-shadow:0 0 10px var(--glow)}

    .divider{width:1px;height:38px;background:var(--border);flex-shrink:0}

    /* ─── Pomodoro ───────────────────────────────── */
    #pomo{
      position:fixed;bottom:120px;right:32px;z-index:20;
      background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border:1px solid var(--border);border-top:1px solid rgba(255,255,255,0.13);
      border-radius:20px;padding:24px;width:296px;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
      animation:fade-up 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #pomo.hidden{display:none}

    .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .pt{font-weight:800;font-size:0.78rem;color:var(--text-2);letter-spacing:0.08em;text-transform:uppercase}
    .ps{display:flex;gap:5px}
    .pd{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background 0.3s}
    .pd.on{background:var(--accent)}

    .pb{display:flex;align-items:center;gap:20px}
    .pr{position:relative;flex-shrink:0;width:96px;height:96px}
    .pr svg{width:96px;height:96px}
    .pt2{fill:none;stroke:rgba(255,255,255,0.05);stroke-width:5}
    #pp{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:251;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s linear}
    .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    #pt{font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--text)}
    #pl{font-size:0.52rem;font-weight:800;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px}

    .pctrl{flex:1}
    .pbtns{display:flex;gap:7px;margin-bottom:14px}
    .pbtn{flex:1;padding:9px 0;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text-2);font-family:var(--font);font-weight:700;font-size:0.73rem;cursor:pointer;transition:all 0.2s}
    .pbtn:hover{border-color:var(--border-h);color:var(--text)}
    .pbtn.pri{border-color:var(--accent);color:var(--accent)}
    .pbtn.pri:hover{background:var(--accent);color:#04040e}

    .psets{display:flex;flex-direction:column;gap:8px}
    .pset{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .pset-label{font-size:0.62rem;font-weight:700;color:var(--text-2);white-space:nowrap}
    .pset input[type=range]{max-width:96px}

    @media(max-width:600px){
      #ui{padding:18px 18px 20px}
      #player{gap:12px;padding:14px 16px}
      #play{width:50px;height:50px}
      #pomo{width:calc(100vw - 36px);right:18px;bottom:106px}
      #ambience{font-size:1.6rem;letter-spacing:0.3em}
    }
  </style>
</head>
<body>

<div id="yt"><div id="yt-player"></div></div>
<div id="bg"></div>
<div id="vignette"></div>
<canvas id="spotlight"></canvas>

<div id="ui">
  <div id="top">
    <div class="logo">MyBrain<b>FM</b></div>
    <div id="pill"><div class="dot"></div><span id="pill-txt">idle</span></div>
    <button id="timer-btn">⏱ timer</button>
  </div>

  <div id="center"><div id="ambience">Ambience</div></div>

  <div>
    <div id="dots"></div>
    <div id="player">
      <button class="ctrl" id="prev-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="play">
        <svg id="play-icon" width="26" height="26" viewBox="0 0 28 28" fill="none">
          <path id="play-path" d="M8 5.5L22 14L8 22.5V5.5Z" fill="white"/>
        </svg>
      </button>
      <button class="ctrl" id="next-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 4V8l-5.5 4zM16 6h2v12h-2z"/></svg>
      </button>
      <div class="divider"></div>
      <div class="vol-group">
        <div class="vol-label">Volume <span id="vol-val">80%</span></div>
        <input type="range" id="vol" min="0" max="100" step="1" value="80">
      </div>
    </div>
  </div>
</div>

<!-- Pomodoro -->
<div id="pomo" class="hidden">
  <div class="ph">
    <div class="pt">Pomodoro</div>
    <div class="ps" id="pomo-dots"></div>
  </div>
  <div class="pb">
    <div class="pr">
      <svg viewBox="0 0 80 80">
        <circle class="pt2" cx="40" cy="40" r="36"/>
        <circle id="pp" cx="40" cy="40" r="36" style="stroke-dasharray:226.2;stroke-dashoffset:0;"/>
      </svg>
      <div class="pc"><div id="pt">25:00</div><div id="pl">work</div></div>
    </div>
    <div class="pctrl">
      <div class="pbtns">
        <button class="pbtn pri" id="ps-btn">Start</button>
        <button class="pbtn" id="pr-btn">Reset</button>
      </div>
      <div class="psets">
        <div class="pset"><span class="pset-label">Work <span id="pw-val">25</span>m</span><input type="range" id="pw" min="5" max="60" step="5" value="25"></div>
        <div class="pset"><span class="pset-label">Break <span id="pb-val">5</span>m</span><input type="range" id="pbr" min="1" max="30" step="1" value="5"></div>
        <div class="pset"><span class="pset-label">Long Break <span id="plb-val">15</span>m</span><input type="range" id="plb" min="5" max="60" step="5" value="15"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ── Config ───────────────────────────────────────────────────
const PLAYLIST = 'PLzoyJrzmctOqXp-xZT5CQyaJwdk2Ck3J8';
const IMGS = [
  '/static/images/city_rain.jpg',
  '/static/images/metropolis.jpg',
  '/static/images/cyberpunk_neon.jpg',
  '/static/images/astronaut.jpg',
  '/static/images/snow_city.jpg',
  '/static/images/city_distance.jpg',
];
const IMG_DUR = 60000;

// ── State ────────────────────────────────────────────────────
let playing = false, curImg = 0, imgTimer = null;
let yt = null, ytReady = false;

// ── WebGL Spotlight ──────────────────────────────────────────
const canvas = document.getElementById('spotlight');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
let mx = -1, my = -1;

function initGL() {
  if (!gl) return;
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  const vs = `
    attribute vec2 a_pos;
    void main(){gl_Position=vec4(a_pos,0,1);}
  `;
  const fs = `
    precision mediump float;
    uniform vec2 u_res;
    uniform vec2 u_mouse;
    uniform float u_time;
    void main(){
      vec2 uv = gl_FragCoord.xy / u_res;
      vec2 mouse = u_mouse / u_res;
      mouse.y = 1.0 - mouse.y;
      float d = distance(uv, mouse);
      // Spotlight cone
      float spot = smoothstep(0.28, 0.0, d);
      // Chromatic tint: blue/purple
      vec3 col = vec3(0.18, 0.35, 1.0) * spot * 0.12;
      // Animated shimmer ring
      float ring = smoothstep(0.002, 0.0, abs(d - 0.14 - 0.01*sin(u_time*2.0)));
      col += vec3(0.5, 0.6, 1.0) * ring * 0.3;
      float ring2 = smoothstep(0.001, 0.0, abs(d - 0.22));
      col += vec3(0.3, 0.4, 0.9) * ring2 * 0.12;
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    return sh;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes   = gl.getUniformLocation(prog, 'u_res');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');
  const uTime  = gl.getUniformLocation(prog, 'u_time');

  let t = 0;
  function frame() {
    t += 0.016;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform2f(uMouse, mx < 0 ? -9999 : mx, my);
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
document.addEventListener('mouseleave', () => { mx = -1; my = -1; });
initGL();

// ── Slides ───────────────────────────────────────────────────
const bgEl = document.getElementById('bg');
const slides = [];

function buildSlides() {
  IMGS.forEach((src, i) => {
    const d = document.createElement('div');
    d.className = 'slide';
    d.style.backgroundImage = `url('${src}')`;
    d.style.animationDirection = i % 2 ? 'alternate-reverse' : 'alternate';
    d.style.animationDelay = `-${i * 13}s`;
    bgEl.appendChild(d);
    slides.push(d);
  });
  const dotsEl = document.getElementById('dots');
  IMGS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'dot-btn' + (i === 0 ? ' on' : '');
    b.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(b);
  });
  slides[0].classList.add('on');
}

function goTo(i) {
  slides[curImg].classList.remove('on');
  document.querySelectorAll('.dot-btn')[curImg].classList.remove('on');
  curImg = ((i % IMGS.length) + IMGS.length) % IMGS.length;
  slides[curImg].classList.add('on');
  document.querySelectorAll('.dot-btn')[curImg].classList.add('on');
}
function startTimer() { clearInterval(imgTimer); imgTimer = setInterval(() => goTo(curImg + 1), IMG_DUR); }

// ── YouTube ───────────────────────────────────────────────────
function onYouTubeIframeAPIReady() {
  yt = new YT.Player('yt-player', {
    height:'1', width:'1',
    playerVars:{listType:'playlist',list:PLAYLIST,autoplay:0,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,rel:0},
    events:{onReady:e=>{ytReady=true;e.target.setVolume(80);},onStateChange:onState,onError:()=>{setTimeout(()=>yt&&yt.nextVideo(),800);}}
  });
}

function onState(e) {
  const S = YT.PlayerState;
  if (e.data === S.PLAYING) {
    playing = true; updatePlay(); updatePill();
  } else if (e.data === S.PAUSED) {
    playing = false; updatePlay(); updatePill();
  } else if (e.data === S.ENDED) {
    yt.nextVideo();
  }
}

function togglePlay() {
  if (!ytReady) return;
  if (playing) { yt.pauseVideo(); clearInterval(imgTimer); }
  else { yt.playVideo(); startTimer(); }
}

function updatePlay() {
  const btn = document.getElementById('play');
  const path = document.getElementById('play-path');
  btn.classList.toggle('on', playing);
  path.setAttribute('d', playing
    ? 'M7 4H12V24H7V4ZM16 4H21V24H16V4Z'
    : 'M8 5.5L22 14L8 22.5V5.5Z');
}

function updatePill() {
  const pill = document.getElementById('pill');
  const txt  = document.getElementById('pill-txt');
  pill.classList.toggle('on', playing);
  if (playing) {
    try { const d = yt.getVideoData(); txt.textContent = d.title || 'playing'; } catch(e) { txt.textContent = 'playing'; }
  } else { txt.textContent = 'idle'; }
}

document.getElementById('play').addEventListener('click', togglePlay);
document.getElementById('prev-btn').addEventListener('click', () => ytReady && yt.previousVideo());
document.getElementById('next-btn').addEventListener('click', () => ytReady && yt.nextVideo());
document.getElementById('vol').addEventListener('input', e => {
  const v = parseInt(e.target.value);
  document.getElementById('vol-val').textContent = v + '%';
  if (ytReady) yt.setVolume(v);
});

// ── Pomodoro ─────────────────────────────────────────────────
const CIRC = 226.2;
const p = {run:false,phase:'work',el:0,sess:0,tmr:null,w:25*60,b:5*60,lb:15*60};
function pdur(){return p.phase==='work'?p.w:p.phase==='break'?p.b:p.lb;}
function pui(){
  const d=pdur(),r=d-p.el;
  document.getElementById('pt').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
  document.getElementById('pl').textContent=p.phase==='work'?'work':'rest';
  document.getElementById('pp').style.strokeDashoffset=CIRC*(1-p.el/d);
  const dots=document.getElementById('pomo-dots');dots.innerHTML='';
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='pd'+(i<p.sess%4?' on':'');dots.appendChild(d);}
}
function padv(){
  if(p.phase==='work'){p.sess++;p.el=0;p.phase=p.sess%4===0?'longbreak':'break';if(playing&&ytReady)yt.pauseVideo();pnotify('Rest!');}
  else{p.el=0;p.phase='work';if(ytReady)yt.playVideo();pnotify('Back to work!');}
  pui();
}
function pstart(){
  if(p.run){clearInterval(p.tmr);p.run=false;document.getElementById('ps-btn').textContent='Resume';}
  else{if(!playing)togglePlay();p.run=true;p.tmr=setInterval(()=>{p.el++;p.el>=pdur()?padv():pui();},1000);document.getElementById('ps-btn').textContent='Pause';}
}
function pstop(){clearInterval(p.tmr);p.run=false;}
function preset(){pstop();p.el=0;p.phase='work';p.sess=0;document.getElementById('ps-btn').textContent='Start';pui();}
function pnotify(m){if('Notification'in window&&Notification.permission==='granted')new Notification('MyBrainFM',{body:m});}

document.getElementById('ps-btn').addEventListener('click',pstart);
document.getElementById('pr-btn').addEventListener('click',preset);
[['pw','w','pw-val'],['pbr','b','pb-val'],['plb','lb','plb-val']].forEach(([id,key,vid])=>{
  document.getElementById(id).addEventListener('input',e=>{
    const v=parseInt(e.target.value);
    document.getElementById(vid).textContent=v;
    p[key]=v*60;if(!p.run){p.el=0;pui();}
  });
});
document.getElementById('timer-btn').addEventListener('click',()=>{
  const el=document.getElementById('pomo');
  const h=el.classList.toggle('hidden');
  document.getElementById('timer-btn').classList.toggle('on',!h);
  if(!h){pui();if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}
  if(h&&p.run)pstop();
});

// ── Init ──────────────────────────────────────────────────────
buildSlides();
pui();
</script>
</body>
</html>
