<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MyBrainFM</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=DM+Sans:wght@200;300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }

    :root {
      --cyan:    #00d4ff;
      --cyan-2:  #0090cc;
      --red:     #ff3c3c;
      --amber:   #ffaa00;
      --glow:    rgba(0,212,255,0.22);
      --surface: rgba(4,8,20,0.78);
      --glass:   rgba(0,212,255,0.05);
      --border:  rgba(0,212,255,0.14);
      --border-h:rgba(0,212,255,0.35);
      --text:    #cde8f0;
      --text-2:  rgba(180,220,235,0.5);
      --font:    'DM Sans', sans-serif;
      --head:    'Rajdhani', sans-serif;
      --mono:    'Space Mono', monospace;
    }

    html, body { width:100%; height:100%; overflow:hidden; background:#010409 }
    body { font-family:var(--font); color:var(--text) }

    /* ── Hidden YouTube ──────────────────────────── */
    #yt { position:fixed; width:1px; height:1px; top:-9999px; left:-9999px; pointer-events:none; z-index:-1 }

    /* ── Background image ───────────────────────── */
    #bg {
      position:fixed; inset:0; z-index:0;
      background: url('/static/images/cyberpunk_room.jpg') center/cover no-repeat;
      transform: translateZ(0);
    }

    /* ── Rain canvas — perfectly aligned ────────── */
    /* position:fixed + inset:0 = always exactly covers viewport, never misaligns */
    #rain {
      position:fixed; inset:0; z-index:1;
      pointer-events:none;
      opacity:0.55;
    }

    /* ── Wet glass overlay ──────────────────────── */
    #wet {
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background:
        linear-gradient(180deg,
          rgba(0,30,50,0.30) 0%,
          transparent 30%,
          transparent 65%,
          rgba(0,15,30,0.55) 100%
        );
    }
    /* Subtle scanline texture — cinematic feel */
    #wet::after {
      content:'';
      position:absolute; inset:0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events:none;
    }

    /* ── WebGL Spotlight ────────────────────────── */
    #spotlight {
      position:fixed; inset:0; z-index:3;
      pointer-events:none;
      mix-blend-mode:screen;
      opacity:0.5;
    }

    /* ── UI shell ───────────────────────────────── */
    #ui {
      position:fixed; inset:0; z-index:10;
      display:flex; flex-direction:column;
      justify-content:space-between;
      padding:24px 28px 28px;
      pointer-events:none;
    }

    /* ── Header ─────────────────────────────────── */
    #top {
      display:flex; align-items:center; justify-content:space-between;
      pointer-events:all;
      animation: hdr-in 0.9s 0.1s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes hdr-in { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }

    .logo {
      font-family:var(--head); font-weight:700; font-size:1.55rem;
      letter-spacing:0.08em; text-transform:uppercase; color:var(--text);
      text-shadow: 0 0 20px rgba(0,212,255,0.4);
    }
    .logo b { color:var(--cyan); font-weight:700 }

    /* Live status indicator */
    #pill {
      display:flex; align-items:center; gap:7px;
      font-family:var(--mono); font-size:0.56rem;
      letter-spacing:0.12em; text-transform:uppercase;
      color:var(--text-2); background:var(--surface);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid var(--border); border-radius:3px;
      padding:6px 12px; transition:all 0.4s;
    }
    #pill .dot {
      width:5px; height:5px; border-radius:50%;
      background:var(--text-2); flex-shrink:0; transition:all 0.3s;
    }
    #pill.on .dot { background:var(--cyan); box-shadow:0 0 8px var(--cyan); animation:blink 2s infinite }
    #pill.on { color:var(--text); border-color:var(--border-h) }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    #timer-btn {
      background:var(--surface); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid var(--border); border-radius:3px;
      padding:8px 16px; color:var(--text-2);
      font-family:var(--head); font-size:0.85rem; font-weight:600;
      letter-spacing:0.06em; text-transform:uppercase;
      cursor:pointer; transition:all 0.2s;
    }
    #timer-btn:hover { border-color:var(--border-h); color:var(--cyan); box-shadow:0 0 12px var(--glow) }
    #timer-btn.on  { border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 14px var(--glow) }

    /* ── Center ─────────────────────────────────── */
    #center { flex:1; display:flex; align-items:center; justify-content:center; pointer-events:none }
    #label {
      font-family:var(--head); font-weight:300; font-size:clamp(1.4rem,4vw,3.2rem);
      letter-spacing:0.55em; text-transform:uppercase; text-indent:0.55em;
      color:rgba(0,212,255,0.08);
      text-shadow:0 0 60px rgba(0,212,255,0.05);
      animation:label-in 2.5s 1s both; user-select:none;
    }
    @keyframes label-in { from{opacity:0} to{opacity:1} }

    /* ── Player bar ─────────────────────────────── */
    #player {
      display:flex; align-items:center; gap:18px;
      background:var(--surface);
      backdrop-filter:blur(32px) saturate(160%); -webkit-backdrop-filter:blur(32px) saturate(160%);
      border:1px solid var(--border);
      border-top:1px solid rgba(0,212,255,0.22);
      border-radius:4px;
      padding:16px 22px;
      pointer-events:all;
      animation:bar-in 0.9s 0.3s cubic-bezier(0.4,0,0.2,1) both;
      box-shadow:
        0 -2px 0 rgba(0,212,255,0.08),
        0 -20px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(0,212,255,0.06);
      position:relative; overflow:hidden;
    }
    /* Cyan top edge glow */
    #player::before {
      content:'';
      position:absolute; top:0; left:10%; right:10%; height:1px;
      background:linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity:0.4;
    }
    @keyframes bar-in { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

    /* Control buttons */
    .ctrl {
      width:36px; height:36px; border-radius:2px;
      background:rgba(0,212,255,0.04); border:1px solid var(--border);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; color:var(--text-2); transition:all 0.2s;
    }
    .ctrl:hover { background:rgba(0,212,255,0.1); color:var(--cyan); border-color:var(--border-h); box-shadow:0 0 10px var(--glow) }
    .ctrl svg { width:14px; height:14px }

    /* Play button */
    #play {
      width:56px; height:56px; border-radius:3px; flex-shrink:0;
      background:linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,144,204,0.08));
      border:1px solid var(--cyan-2);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all 0.25s;
      box-shadow:0 0 20px var(--glow), inset 0 1px 0 rgba(0,212,255,0.2);
      position:relative; overflow:hidden;
    }
    #play::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg, rgba(0,212,255,0.08), transparent);
      transition:opacity 0.2s;
    }
    #play:hover { transform:scale(1.05); box-shadow:0 0 30px var(--glow),0 0 50px rgba(0,212,255,0.1); border-color:var(--cyan) }
    #play.on { border-color:var(--cyan); box-shadow:0 0 24px var(--glow); animation:play-pulse 2.5s ease-in-out infinite }
    @keyframes play-pulse {
      0%,100%{ box-shadow:0 0 24px var(--glow) }
      50%    { box-shadow:0 0 40px var(--glow),0 0 70px rgba(0,212,255,0.15) }
    }

    /* Volume */
    .vol-wrap { display:flex; flex-direction:column; gap:6px; flex:1; min-width:0 }
    .vol-lbl {
      display:flex; justify-content:space-between;
      font-family:var(--head); font-size:0.65rem; font-weight:600;
      letter-spacing:0.1em; text-transform:uppercase; color:var(--text-2);
    }
    .vol-lbl span { color:var(--cyan) }

    input[type=range] {
      -webkit-appearance:none; appearance:none;
      width:100%; height:2px;
      background:rgba(0,212,255,0.12); border-radius:1px; outline:none; cursor:pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance:none; width:12px; height:12px; border-radius:1px;
      background:var(--cyan); box-shadow:0 0 8px var(--glow); cursor:pointer;
      transition:transform 0.15s, box-shadow 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.5); box-shadow:0 0 14px var(--glow) }
    input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:1px; background:var(--cyan); border:none; box-shadow:0 0 8px var(--glow) }

    .div { width:1px; height:36px; background:var(--border); flex-shrink:0 }

    /* ── Pomodoro panel ─────────────────────────── */
    #pomo {
      position:fixed; bottom:110px; right:28px; z-index:20;
      background:var(--surface); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border:1px solid var(--border); border-top:1px solid rgba(0,212,255,0.2);
      border-radius:4px; padding:22px; width:290px;
      box-shadow:0 20px 60px rgba(0,0,0,0.6);
      animation:bar-in 0.3s cubic-bezier(0.4,0,0.2,1) both;
    }
    #pomo.hidden { display:none }
    #pomo::before {
      content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent); opacity:0.35;
    }

    .ph { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px }
    .pt { font-family:var(--head); font-weight:600; font-size:0.72rem; color:var(--text-2); letter-spacing:0.12em; text-transform:uppercase }
    .pdots { display:flex; gap:5px }
    .pd { width:6px; height:6px; border-radius:1px; background:var(--border); transition:background 0.3s }
    .pd.on { background:var(--cyan); box-shadow:0 0 6px var(--glow) }

    .pb { display:flex; align-items:center; gap:18px }
    .pr { position:relative; flex-shrink:0; width:90px; height:90px }
    .pr svg { width:90px; height:90px }
    .ptrack { fill:none; stroke:rgba(0,212,255,0.08); stroke-width:4 }
    #pp { fill:none; stroke:var(--cyan); stroke-width:4; stroke-linecap:square; stroke-dasharray:226; stroke-dashoffset:0; transform:rotate(-90deg); transform-origin:center; transition:stroke-dashoffset 1s linear; filter:drop-shadow(0 0 4px var(--cyan)) }
    .pc { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center }
    #ptime { font-family:var(--mono); font-size:1rem; font-weight:700; color:var(--text) }
    #pphase { font-family:var(--head); font-size:0.5rem; font-weight:600; color:var(--cyan); letter-spacing:0.15em; text-transform:uppercase; margin-top:2px }

    .pctrl { flex:1 }
    .pbtns { display:flex; gap:7px; margin-bottom:13px }
    .pbtn {
      flex:1; padding:8px 0;
      background:rgba(0,212,255,0.04); border:1px solid var(--border);
      border-radius:2px; color:var(--text-2);
      font-family:var(--head); font-weight:600; font-size:0.72rem;
      letter-spacing:0.06em; text-transform:uppercase;
      cursor:pointer; transition:all 0.2s;
    }
    .pbtn:hover { border-color:var(--border-h); color:var(--text) }
    .pbtn.pri { border-color:var(--cyan); color:var(--cyan) }
    .pbtn.pri:hover { background:var(--cyan); color:#010409 }

    .psets { display:flex; flex-direction:column; gap:7px }
    .pset { display:flex; align-items:center; justify-content:space-between; gap:10px }
    .pset-lbl { font-family:var(--head); font-size:0.6rem; font-weight:600; color:var(--text-2); letter-spacing:0.06em; white-space:nowrap }
    .pset input[type=range] { max-width:90px }

    /* ── Tablet (601–900px) ──────────────────────── */
    @media(min-width:601px) and (max-width:900px) {
      #ui { padding:20px 22px 24px }
      .logo { font-size:1.35rem }
      #pill { max-width:180px }
      #pill-txt { max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
      #label { font-size:clamp(1.2rem,3vw,2.2rem); letter-spacing:0.4em }
      #player { gap:14px; padding:14px 18px }
      #play { width:52px; height:52px }
      #pomo { width:280px; right:22px; bottom:104px }
    }

    /* ── Mobile (≤600px) ─────────────────────────── */
    @media(max-width:600px) {
      #ui { padding:env(safe-area-inset-top,14px) 14px 18px }

      /* Header — hide pill, compact logo + timer */
      #pill { display:none }
      .logo { font-size:1.15rem; letter-spacing:0.06em }
      #timer-btn { padding:7px 11px; font-size:0.7rem; letter-spacing:0.04em }

      /* Center label */
      #label { font-size:0.9rem; letter-spacing:0.22em }

      /* Player — single row, everything fits */
      #player {
        gap:8px; padding:11px 12px; border-radius:3px;
        /* Ensure it never overflows */
        flex-wrap:nowrap; overflow:hidden;
      }
      .ctrl { width:32px; height:32px; flex-shrink:0 }
      .ctrl svg { width:12px; height:12px }
      #play { width:46px; height:46px; flex-shrink:0 }
      #play svg { width:18px; height:18px }
      .div { height:26px; flex-shrink:0 }
      .vol-lbl { font-size:0.55rem }
      .vol-wrap { min-width:0; flex:1 }

      /* Pomodoro — full width, above player */
      #pomo {
        width:calc(100vw - 28px);
        left:14px; right:14px;
        bottom:90px;
        padding:16px;
        border-radius:3px;
      }
      .pb { gap:12px }
      .pr { width:80px; height:80px; flex-shrink:0 }
      .pr svg { width:80px; height:80px }
      #ptime { font-size:0.9rem }
      .psets { gap:6px }
      .pset input[type=range] { max-width:80px }
    }

    /* ── Very small (≤380px) ─────────────────────── */
    @media(max-width:380px) {
      .logo { font-size:1rem }
      #timer-btn { padding:6px 9px; font-size:0.65rem }
      #player { gap:6px; padding:10px 10px }
      #play { width:42px; height:42px }
      .ctrl { width:28px; height:28px }
      .ctrl svg { width:11px; height:11px }
      #label { font-size:0.75rem; letter-spacing:0.18em }
    }
  </style>
</head>
<body>

<div id="yt"><div id="yt-player"></div></div>

<!-- Background: single image, fixed, always aligned -->
<div id="bg"></div>

<!-- Rain canvas: fixed+inset:0, resized in JS, never misaligns -->
<canvas id="rain"></canvas>

<!-- Cinematic overlay + scanlines -->
<div id="wet"></div>

<!-- WebGL spotlight -->
<canvas id="spotlight"></canvas>

<!-- UI -->
<div id="ui">
  <div id="top">
    <div class="logo">MyBrain<b>FM</b></div>
    <div id="pill"><div class="dot"></div><span id="pill-txt">standby</span></div>
    <button id="timer-btn">⏱ Timer</button>
  </div>

  <div id="center"><div id="label">Ambience</div></div>

  <div id="player">
    <button class="ctrl" id="prev-btn" title="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button id="play" title="Play / Pause">
      <svg id="play-icon" width="22" height="22" viewBox="0 0 28 28" fill="none">
        <path id="play-path" d="M8 5.5L22 14L8 22.5V5.5Z" fill="#00d4ff"/>
      </svg>
    </button>
    <button class="ctrl" id="next-btn" title="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 4V8l-5.5 4zM16 6h2v12h-2z"/></svg>
    </button>
    <div class="div"></div>
    <div class="vol-wrap">
      <div class="vol-lbl">Volume <span id="vol-val">80%</span></div>
      <input type="range" id="vol" min="0" max="100" step="1" value="80">
    </div>
  </div>
</div>

<!-- Pomodoro -->
<div id="pomo" class="hidden">
  <div class="ph">
    <div class="pt">Pomodoro</div>
    <div class="pdots" id="pdots"></div>
  </div>
  <div class="pb">
    <div class="pr">
      <svg viewBox="0 0 80 80">
        <circle class="ptrack" cx="40" cy="40" r="36"/>
        <circle id="pp" cx="40" cy="40" r="36" style="stroke-dasharray:226;stroke-dashoffset:0;"/>
      </svg>
      <div class="pc"><div id="ptime">25:00</div><div id="pphase">work</div></div>
    </div>
    <div class="pctrl">
      <div class="pbtns">
        <button class="pbtn pri" id="ps-btn">Start</button>
        <button class="pbtn" id="pr-btn">Reset</button>
      </div>
      <div class="psets">
        <div class="pset"><span class="pset-lbl">Work <span id="pw-val">25</span>m</span><input type="range" id="pw" min="5" max="60" step="5" value="25"></div>
        <div class="pset"><span class="pset-lbl">Break <span id="pb-val">5</span>m</span><input type="range" id="pbr" min="1" max="30" step="1" value="5"></div>
        <div class="pset"><span class="pset-lbl">Long <span id="plb-val">15</span>m</span><input type="range" id="plb" min="5" max="60" step="5" value="15"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ── YouTube ───────────────────────────────────────────────────
const PLAYLIST = 'PLzoyJrzmctOqXp-xZT5CQyaJwdk2Ck3J8';
let yt = null, ytReady = false, playing = false;

function onYouTubeIframeAPIReady() {
  yt = new YT.Player('yt-player', {
    height:'1', width:'1',
    playerVars:{listType:'playlist',list:PLAYLIST,autoplay:0,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,rel:0},
    events:{
      onReady: e => { ytReady=true; e.target.setVolume(80); },
      onStateChange: e => {
        const S=YT.PlayerState;
        if(e.data===S.PLAYING){ playing=true; updPlay(); updPill(); }
        else if(e.data===S.PAUSED){ playing=false; updPlay(); updPill(); }
        else if(e.data===S.ENDED){ yt.nextVideo(); }
      },
      onError: () => setTimeout(()=>yt&&yt.nextVideo(), 800)
    }
  });
}

function togglePlay(){
  if(!ytReady) return;
  playing ? yt.pauseVideo() : yt.playVideo();
}
function updPlay(){
  document.getElementById('play').classList.toggle('on', playing);
  document.getElementById('play-path').setAttribute('d',
    playing ? 'M7 4H12V24H7V4ZM16 4H21V24H16V4Z' : 'M8 5.5L22 14L8 22.5V5.5Z'
  );
}
function updPill(){
  const pill=document.getElementById('pill'), txt=document.getElementById('pill-txt');
  pill.classList.toggle('on', playing);
  if(playing){ try{ const d=yt.getVideoData(); txt.textContent=d.title||'online'; }catch(e){ txt.textContent='online'; } }
  else txt.textContent='standby';
}

document.getElementById('play').addEventListener('click', togglePlay);
document.getElementById('prev-btn').addEventListener('click', ()=>ytReady&&yt.previousVideo());
document.getElementById('next-btn').addEventListener('click', ()=>ytReady&&yt.nextVideo());
document.getElementById('vol').addEventListener('input', e=>{
  const v=parseInt(e.target.value);
  document.getElementById('vol-val').textContent=v+'%';
  if(ytReady) yt.setVolume(v);
});

// ── Rain Animation ────────────────────────────────────────────
// Canvas is position:fixed + inset:0. We resize it to match the
// window exactly. This is guaranteed to be pixel-perfect aligned.
const rainCanvas = document.getElementById('rain');
const rctx = rainCanvas.getContext('2d');

function resizeRain(){
  rainCanvas.width  = window.innerWidth;
  rainCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeRain);
resizeRain();

// Raindrop system
const DROPS = [];
const DROP_COUNT = 200;

function initDrops(){
  for(let i=0; i<DROP_COUNT; i++){
    DROPS.push({
      x:     Math.random() * window.innerWidth,
      y:     Math.random() * window.innerHeight,
      len:   8  + Math.random() * 22,
      speed: 8  + Math.random() * 14,
      width: 0.5 + Math.random() * 0.8,
      alpha: 0.1 + Math.random() * 0.45,
      angle: 0.25 + Math.random() * 0.18, // slight diagonal
    });
  }
}
initDrops();

// Splashes at the bottom
const SPLASHES = [];
function addSplash(x){
  SPLASHES.push({ x, y: window.innerHeight - 2, r:0, maxR:3+Math.random()*6, alpha:0.6, life:0 });
}

function drawRain(){
  rctx.clearRect(0,0,rainCanvas.width,rainCanvas.height);

  const W=rainCanvas.width, H=rainCanvas.height;

  DROPS.forEach(d=>{
    const dx = Math.sin(d.angle) * d.len;
    const dy = Math.cos(d.angle) * d.len;

    // Streak gradient — bright head, fading tail
    const grad = rctx.createLinearGradient(d.x, d.y, d.x+dx, d.y+dy);
    grad.addColorStop(0, `rgba(160,220,255,${d.alpha})`);
    grad.addColorStop(1, `rgba(120,180,240,0)`);

    rctx.beginPath();
    rctx.moveTo(d.x, d.y);
    rctx.lineTo(d.x + dx, d.y + dy);
    rctx.strokeStyle = grad;
    rctx.lineWidth = d.width;
    rctx.stroke();

    // Advance drop
    d.x += Math.sin(d.angle) * d.speed;
    d.y += Math.cos(d.angle) * d.speed;

    // Splash when hitting bottom
    if(d.y > H){
      if(Math.random()<0.3) addSplash(d.x);
      d.y = -d.len;
      d.x = Math.random() * W;
    }
    if(d.x > W + 30) d.x = -30;
  });

  // Draw splashes
  for(let i=SPLASHES.length-1; i>=0; i--){
    const s=SPLASHES[i];
    s.r += 0.4;
    s.alpha -= 0.04;
    s.life++;
    if(s.alpha<=0){ SPLASHES.splice(i,1); continue; }
    rctx.beginPath();
    rctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    rctx.strokeStyle = `rgba(160,220,255,${s.alpha})`;
    rctx.lineWidth = 0.5;
    rctx.stroke();
  }

  requestAnimationFrame(drawRain);
}
requestAnimationFrame(drawRain);

// ── WebGL Spotlight ───────────────────────────────────────────
const sc = document.getElementById('spotlight');
const gl = sc.getContext('webgl')||sc.getContext('experimental-webgl');
let mx=-1, my=-1;

if(gl && !('ontouchstart' in window)){
  function rsGL(){ sc.width=window.innerWidth; sc.height=window.innerHeight; gl.viewport(0,0,sc.width,sc.height); }
  window.addEventListener('resize',rsGL); rsGL();
  document.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });
  document.addEventListener('mouseleave',()=>{ mx=-1; my=-1; });

  const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
  const fs=`precision mediump float;uniform vec2 res,mouse;uniform float t;void main(){
    vec2 uv=gl_FragCoord.xy/res,m=mouse/res;m.y=1.-m.y;
    float d=distance(uv,m);
    float spot=smoothstep(.08,.0,d);
    vec3 col=vec3(.05,.45,.7)*spot*.10;
    float r1=smoothstep(.001,.0,abs(d-.04-.005*sin(t*3.)));
    col+=vec3(.2,.8,1.)*r1*.25;
    float r2=smoothstep(.001,.0,abs(d-.07));
    col+=vec3(.1,.6,.9)*r2*.10;
    gl_FragColor=vec4(col,1.);
  }`;
  function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return s; }
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const ploc=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(ploc); gl.vertexAttribPointer(ploc,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(prog,'res'), uM=gl.getUniformLocation(prog,'mouse'), uT=gl.getUniformLocation(prog,'t');
  let tt=0;
  (function frame(){ tt+=.016; gl.uniform2f(uR,sc.width,sc.height); gl.uniform2f(uM,mx<0?-9999:mx,my); gl.uniform1f(uT,tt); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); requestAnimationFrame(frame); })();
} else {
  sc.style.display='none';
}

// ── Pomodoro ──────────────────────────────────────────────────
const CIRC=226;
const p={run:false,phase:'work',el:0,sess:0,tmr:null,w:25*60,b:5*60,lb:15*60};
function pdur(){ return p.phase==='work'?p.w:p.phase==='break'?p.b:p.lb; }
function pui(){
  const d=pdur(), r=d-p.el;
  document.getElementById('ptime').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
  document.getElementById('pphase').textContent=p.phase==='work'?'work':'rest';
  document.getElementById('pp').style.strokeDashoffset=CIRC*(1-p.el/d);
  const dots=document.getElementById('pdots'); dots.innerHTML='';
  for(let i=0;i<4;i++){ const d=document.createElement('div'); d.className='pd'+(i<p.sess%4?' on':''); dots.appendChild(d); }
}
function padv(){
  if(p.phase==='work'){ p.sess++; p.el=0; p.phase=p.sess%4===0?'longbreak':'break'; if(playing&&ytReady)yt.pauseVideo(); pnotify('Rest!'); }
  else { p.el=0; p.phase='work'; if(ytReady)yt.playVideo(); pnotify('Back to work!'); }
  pui();
}
function pstart(){
  if(p.run){ clearInterval(p.tmr); p.run=false; document.getElementById('ps-btn').textContent='Resume'; }
  else { if(!playing)togglePlay(); p.run=true; p.tmr=setInterval(()=>{ p.el++; p.el>=pdur()?padv():pui(); },1000); document.getElementById('ps-btn').textContent='Pause'; }
}
function preset(){ clearInterval(p.tmr); p.run=false; p.el=0; p.phase='work'; p.sess=0; document.getElementById('ps-btn').textContent='Start'; pui(); }
function pnotify(m){ if('Notification'in window&&Notification.permission==='granted')new Notification('MyBrainFM',{body:m}); }

document.getElementById('ps-btn').addEventListener('click',pstart);
document.getElementById('pr-btn').addEventListener('click',preset);
[['pw','w','pw-val'],['pbr','b','pb-val'],['plb','lb','plb-val']].forEach(([id,key,vid])=>{
  document.getElementById(id).addEventListener('input',e=>{
    const v=parseInt(e.target.value);
    document.getElementById(vid).textContent=v;
    p[key]=v*60; if(!p.run){ p.el=0; pui(); }
  });
});
document.getElementById('timer-btn').addEventListener('click',()=>{
  const el=document.getElementById('pomo');
  const h=el.classList.toggle('hidden');
  document.getElementById('timer-btn').classList.toggle('on',!h);
  if(!h){ pui(); if('Notification'in window&&Notification.permission==='default')Notification.requestPermission(); }
  if(h&&p.run){ clearInterval(p.tmr); p.run=false; }
});

pui();
